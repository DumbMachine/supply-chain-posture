name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Syntax check
        run: bash -n supply-chain-posture.sh

      - name: Lint (shellcheck is preinstalled on ubuntu runners)
        run: shellcheck -S warning supply-chain-posture.sh

      - name: Self-audit (must run without crashing)
        run: bash supply-chain-posture.sh --no-color || true
